# Ads Action Engine web server: serves the built SPA and reverse-proxies /api to the API.
#
# web/Dockerfile copies this file to /etc/nginx/conf.d/default.conf in nginx:1.30.5, replacing
# the image's default server. The image's main nginx.conf includes conf.d/*.conf inside its
# http {} block, so the directives above the server block below are http-level directives.
#
#   /api/          proxied to http://api:8000 (the Compose `api` service), URI unchanged; an
#                  error nginx makes itself there is JSON in the API's error envelope
#   /assets/       hashed Vite build output, cached immutable for a year; a missing file 404s
#   /index.html    the SPA document, never stored (no-store), so it is fetched on every load
#   /favicon.ico   204: the product ships no icon set
#   /robots.txt    plain-text robots rules: crawlers may read every screen, never /api/
#   /llms.txt      404: the product publishes none
#   /sitemap.xml   404: the product publishes none
#   everything     else falls back to /index.html (SPA routes such as /actions?run=<id>)
#
# Out of scope here, by design: TLS, HSTS, basic auth and upstream health checks. nginx listens
# on plain HTTP 8080 for the local stack (APP_BASE_URL http://localhost:8080). Any other host
# must terminate TLS in front of nginx and use an https:// APP_BASE_URL (docs/runbook.md).

# Docker's embedded DNS. The api_backend upstream below marks its server `resolve`, so nginx
# re-resolves the `api` name in the background (every 10 s) rather than once at startup: an
# `api` container that restarts with a new address is picked up, and nginx starts, and
# `nginx -t` passes, even while `api` does not resolve. The Compose network carries IPv4 only.
resolver 127.0.0.11 valid=10s ipv6=off;

# The API (the Compose `api` service), with a pool of idle connections nginx reuses instead of
# opening a new TCP connection per request. `resolve` needs the shared-memory zone, and an
# unresolved `api` leaves the group empty, so /api/ answers 502 until the name resolves.
# keepalive caps the idle connections each worker process keeps. keepalive_timeout must stay
# below uvicorn's own idle limit (--timeout-keep-alive, 5 s by default and not overridden):
# nginx then always closes an idle connection before uvicorn does, and never reuses one that
# uvicorn is closing, which would surface as a 502 for a POST, a request nginx does not retry.
upstream api_backend {
  zone api_backend 64k;
  server api:8000 resolve;
  keepalive 16;
  keepalive_timeout 4s;
}

# Host header sent to the API: the client's own Host, port included, or $host when the
# request carried none (HTTP/1.0). This departs from a bare `Host $host`, which drops the
# port: the API builds absolute URLs from Host (FastAPI's trailing-slash redirects), and
# without the port such a redirect from http://localhost:8080 would point at port 80.
map $http_host $api_host_header {
  ""      $host;
  default $http_host;
}

# Access log format `redacted`, used by the server's access_log below in place of the image's
# combined-style `main`. `main` writes the raw request line ($request), $remote_user and
# $http_referer, and with them any password, token, secret or email a client puts in a query
# string, a Referer or a Basic Authorization header. Fields that differ from combined:
#   request line   method, path up to the first `?` or `#`, protocol. A query string, or a
#                  fragment a raw client sent, is dropped whole and logged as `?[REDACTED]`
#                  (`#[REDACTED]`): nginx has no per-key substitution, so it cannot drop
#                  `password=` and keep `run=`. The API logs the same request with each
#                  sensitive key's value redacted (backend/src/ads_engine/logging.py).
#                  The method and path are `-` for a request line nginx could not parse into
#                  a URI, and the protocol is `-` when nginx read none.
#   remote user    always `-`: $remote_user is decoded from a client's Authorization: Basic
#                  header, password and all, and the product uses no basic auth.
#   referer        without its query string or fragment: Referrer-Policy same-origin sends
#                  the page's full URL, query included, with every same-origin request.
# The path, the referer and the user agent are each logged as `[REDACTED_EMAIL]`, the API's
# marker, when they hold an at sign: `@`, or the fullwidth (U+FF20) or small (U+FE6B) one the
# API also reads, raw or percent-encoded to any depth, in any letter case. An absent referer or
# user agent is `-`, as in combined. $request is logged nowhere. For the same reason the server
# block below writes no error log at all (`error_log /dev/null`): nginx's error log has no format.
map $request_uri $log_path_redacted {
  ""  "-";
  "~*^[^?#]*(?:@|\xEF(?:\xBC\xA0|\xB9\xAB)|%(?:25)*(?:40|EF%(?:25)*(?:BC%(?:25)*A0|B9%(?:25)*AB)))"
      "[REDACTED_EMAIL]";
  "~^(?<log_path_bare>[^?#]*)"  $log_path_bare;
}

map $request_uri $log_query_redacted {
  "~^[^?#]*\?"  "?[REDACTED]";
  "~^[^?#]*#"   "#[REDACTED]";
  default       "";
}

map $http_referer $log_referer_redacted {
  ""  "-";
  "~*^[^?#]*(?:@|\xEF(?:\xBC\xA0|\xB9\xAB)|%(?:25)*(?:40|EF%(?:25)*(?:BC%(?:25)*A0|B9%(?:25)*AB)))"
      "[REDACTED_EMAIL]";
  "~^(?<log_referer_bare>[^?#]*)"  $log_referer_bare;
}

map $http_user_agent $log_user_agent_redacted {
  ""  "-";
  "~*(?:@|\xEF(?:\xBC\xA0|\xB9\xAB)|%(?:25)*(?:40|EF%(?:25)*(?:BC%(?:25)*A0|B9%(?:25)*AB)))"
      "[REDACTED_EMAIL]";
  default  $http_user_agent;
}

# The request line's method and protocol as logged. A request line nginx could not parse into
# a URI (a malformed line or path, 414, 505) leaves $request_uri empty, and its method is `-`:
# the 400 handler below re-requests the internal /.nginx/bad-request as GET, so $request_method
# no longer names the client's method. A request line with no protocol nginx could read (a
# malformed line, 414, 505) or with none at all (HTTP/0.9) leaves $server_protocol empty or
# unset, and its protocol is `-`.
map $request_uri $log_method {
  ""       "-";
  default  $request_method;
}

map $server_protocol $log_protocol {
  ""       "-";
  default  $server_protocol;
}

log_format redacted '$remote_addr - - [$time_local] '
                    '"$log_method $log_path_redacted$log_query_redacted $log_protocol" '
                    '$status $body_bytes_sent "$log_referer_redacted" "$log_user_agent_redacted"';

# Target of the server-level 400 handler (error_page in the server block): the named location
# @bad_request for any request with a URI, and the internal /.nginx/bad-request for a request
# line too malformed to yield one, because nginx answers 500 rather than send an empty URI to
# a named location. nginx requests an internal URI as GET, which the access log does not
# repeat ($log_method above); the answer is nginx's own 400 page, as before.
map $uri $bad_request_page {
  ""       /.nginx/bad-request;
  default  @bad_request;
}

# Headers of nginx's own 405 page outside /api/ (@method_not_allowed in the server block). A 405
# there is TRACE or CONNECT, which nginx refuses before it picks a location, or a static file's
# answer to a method other than GET or HEAD in a location that inherits the server's error_page
# list. Each keeps the headers it had before that list named 405: `Cache-Control: no-store` from
# /index.html, where every SPA route ends (so $uri reads /index.html), and none of its own from
# any other location or from the refusal before one.
map "$request_method $uri" $method_not_allowed_no_store {
  "~^(?:TRACE|CONNECT) "   "";
  "~^[^ ]+ /index\.html$"  1;
  default                  "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Redirects nginx issues itself (such as /api -> /api/) carry a relative Location. An
  # absolute one would name this container's own port 8080 and scheme http, which is wrong
  # once the port is published elsewhere or TLS is terminated in front of nginx.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # Every request is logged in the `redacted` format above, never the image's `main`, to the
  # image's /var/log/nginx/access.log, a link to stdout. /assets/ and /favicon.ico log nothing.
  access_log /var/log/nginx/access.log redacted;

  # nginx's error log has no format, so it cannot be redacted: every line it writes about a
  # connection's request names the raw request line read so far, query string included, and,
  # once read, the referer; a proxied request's lines add the upstream URI with the same query,
  # and an oversized header line quotes the header itself, cookies included. The listening
  # socket and every request on it, before nginx picks a location and after, log to this
  # server's error_log, which every location, named ones and `if` blocks included, inherits.
  # So this server writes none, at any level, whatever went wrong: a malformed, oversized or
  # unsupported request (400, 414, 494, 505), a body over 1 MB (413), an API refusing, closing,
  # unresolved or timing out (502, 504), a body buffered to a temporary file, a web-root
  # directory nginx may not search, a full disk, a failed memory allocation or access-log write.
  # Each request's record is its redacted access line and status above, and no location
  # declares an error_log of its own. The image's main-level error_log (`notice`, to stderr)
  # still carries startup, reload and worker-process messages ("worker_connections are not
  # enough, reusing connections" among them) and resolver errors, none of which names a
  # request. The cost: the alerts nginx writes when it cannot accept a connection
  # ("worker_connections are not enough" with none left to reuse, accept4() out of file
  # descriptors) are not logged.
  error_log /dev/null;

  # API request bodies are small JSON documents (login, decisions, feedback, run windows).
  client_max_body_size 1m;

  # text/html is always compressed once gzip is on; these add the other text formats the
  # SPA and the API send. Vary: Accept-Encoding keeps shared caches from mixing encodings.
  # Level 5, not nginx's default 1: the JS bundle ships about 15% smaller and the CSS and the
  # API's JSON 20-30% smaller, within about 2% of level 9's size for about half its CPU. Every
  # body is compressed as it is sent, so the API's JSON gains as much as the static files.
  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Security headers, on every response (`always` covers 4xx/5xx and proxied API answers).
  # nginx drops inherited add_header directives in any location that declares its own, so
  # /api/ and /assets/ declare their Cache-Control after `add_header_inherit merge`, which
  # keeps these three as well. /index.html does the same, and so must any location that adds
  # a header of its own.
  # The production bundle has no inline script or style: index.html loads external module
  # scripts and stylesheets only, and React applies `style` props through the CSSOM, which
  # style-src 'self' permits. Every request, /api included, is same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # A request nginx rejects before it picks a location sees only this list: malformed (400),
  # with headers or cookies beyond large_client_header_buffers (494, sent as 400), with the
  # TRACE or CONNECT method (405), or with a Transfer-Encoding other than `chunked` alone (501).
  # The named locations after /api/ answer one under /api/ in the API's error envelope and any
  # other path with nginx's own page, as before. `=400` keeps the non-standard 494 off the
  # wire. Every location without an error_page of its own inherits this list, so a static
  # file's 405 also passes through @method_not_allowed, which keeps its page and headers
  # ($method_not_allowed_no_store above). /api/ names 405 again in its own list, for the methods
  # it refuses itself, and sees no 501 of nginx's, so its list needs none. A 494, 405 or 501
  # always follows a parsed request line, so its URI is never empty ($bad_request_page above);
  # a CONNECT target names no path, and its URI is `/`. A request line too long (414) or with
  # an HTTP version nginx does not serve (505) leaves no URI to tell /api/ by, so either keeps
  # nginx's own page.
  error_page 400 $bad_request_page;
  error_page 494 =400 @request_header_too_large;
  error_page 405 @method_not_allowed;
  error_page 501 @not_implemented;

  location /api/ {
    # The API serves only these methods. uvicorn's HTTP parser answers a method it does not
    # know (FOO, for example) itself, with a text/plain 400 "Invalid HTTP request received."
    # that none of the API's error handlers sees. nginx refuses every method outside the set
    # here with its own 405, which @method_not_allowed answers with the API's own 405 body
    # (error_page below). `return` is a safe use of `if` in a location: the request ends there.
    if ($request_method !~ "^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") {
      return 405;
    }

    # The api_backend upstream above, with no URI part: the original request URI
    # (/api/v1/...) is passed unchanged. Reusing its pooled connections needs HTTP/1.1 and
    # an empty Connection header, since nginx otherwise sends `Connection: close` upstream.
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $api_host_header;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Overwrite X-Forwarded-For; never append to it with $proxy_add_x_forwarded_for.
    # The API keys its login limit (5 attempts per minute per IP) on the address uvicorn
    # (--proxy-headers) takes from this header when nginx is a trusted peer: the leftmost
    # entry when every peer is trusted (--forwarded-allow-ips *), the rightmost untrusted
    # entry otherwise. Appending would keep a client-written value at the left, so a
    # client could claim a fresh address on every attempt and escape the limit. Set to
    # $remote_addr, the header holds exactly one entry, the peer connected to nginx, and
    # both rules pick it.
    #
    # Behind an external TLS terminator, $remote_addr is the terminator itself and every
    # client would share one key. An operator then restores the client address with the
    # realip module, trusting the terminator alone, for example:
    #   set_real_ip_from <terminator address or CIDR>;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    # after which $remote_addr is the client again and this header stays one entry.
    # (X-Forwarded-Proto then reads http; the session cookie's Secure flag follows
    # APP_BASE_URL, not this header.)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # POST /api/v1/runs computes a custom-window run synchronously (30 s target), and the
    # API cancels any request after its own 45 s deadline. 120 s keeps nginx from cutting
    # in first with its own generic 504, so a slow request still ends in the API's specific
    # error (503 request_timeout).
    proxy_read_timeout 120s;
    proxy_buffering on;

    # A connect on the local Compose network completes in well under a millisecond, so 5 s
    # only cuts short a connect to an `api` address that has vanished: after the container
    # stops, and until the resolver drops its name (502 from then on), a connect there gets
    # no answer, and nginx's 60 s default would hold the request that long before its 504.
    proxy_connect_timeout 5s;

    # API bodies are the signed-in operator's evidence, decisions and identity: no browser or
    # shared cache may keep one after sign-out (CWE-525). This ingress is authoritative, so
    # every /api/ answer, the API's own (here) or an error nginx makes itself (in the error
    # locations below), carries exactly one `Cache-Control: no-store`. The API sends the same
    # value; its copy is hidden so the answer never repeats the header.
    # add_header_inherit merge keeps the server-level Content-Security-Policy,
    # X-Content-Type-Options and Referrer-Policy, which nginx otherwise drops in a location
    # that declares its own add_header.
    proxy_hide_header Cache-Control;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;

    # Errors nginx makes itself here are answered in the API's error envelope,
    # {"error":{"code","message"}} as application/json, by the named locations below, never
    # with nginx's HTML pages: 400 for a malformed body, 405 for a method outside the set
    # above, 413 over client_max_body_size, 502 when the API refuses the connection or its
    # name does not resolve, 504 when a connect or a read times out, and 500 or 503 should
    # nginx itself fail or refuse the request. error_page without `=` keeps each original status.
    # proxy_intercept_errors stays off, so the API's own error answers, its 405, 502 and 503
    # included, pass through untouched. This list replaces the server-level one, so 400 and
    # 405 are listed here again.
    error_page 400 @bad_request;
    error_page 405 @method_not_allowed;
    error_page 413 @api_payload_too_large;
    error_page 500 @api_internal_error;
    error_page 502 503 @api_upstream_unavailable;
    error_page 504 @api_upstream_timeout;
  }

  # nginx's own /api/ errors in the API's error envelope (the error_page lists in /api/ and
  # in the server block). `types { }` and default_type make each answer application/json
  # whatever the URI's extension (/api/v1/x.html included). add_header_inherit merge keeps
  # the server-level security headers beside the one `Cache-Control: no-store` every /api/
  # answer carries. The status after `return` is the one error_page keeps, so
  # @api_upstream_unavailable answers a 503 as 503.
  location @api_payload_too_large {
    types { }
    default_type application/json;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"payload_too_large","message":"The request body is larger than the 1 MB limit."}}';
  }

  location @api_internal_error {
    types { }
    default_type application/json;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
    return 500 '{"error":{"code":"internal_error","message":"Internal server error"}}';
  }

  location @api_upstream_unavailable {
    types { }
    default_type application/json;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":{"code":"upstream_unavailable","message":"The server is temporarily unavailable. Try again shortly."}}';
  }

  location @api_upstream_timeout {
    types { }
    default_type application/json;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
    return 504 '{"error":{"code":"upstream_timeout","message":"The server is temporarily unavailable. Try again shortly."}}';
  }

  # The server-level 400, 494, 405 and 501 handlers, @bad_request also /api/'s 400 handler: the
  # API's error envelope for a URI under /api/, and nginx's own page, status and headers
  # unchanged, for any other path. The page branch declares no add_header, so it keeps exactly
  # the server-level security headers, as before; @method_not_allowed alone adds back the
  # `Cache-Control: no-store` /index.html gives its own 405 ($method_not_allowed_no_store).
  location @bad_request {
    types { }
    default_type application/json;
    if ($uri ~ "^/api/") {
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
      return 400 '{"error":{"code":"bad_request","message":"The request could not be read."}}';
    }
    return 400;
  }

  location @request_header_too_large {
    types { }
    default_type application/json;
    if ($uri ~ "^/api/") {
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
      return 400 '{"error":{"code":"request_header_too_large","message":"The request headers or cookies are too large."}}';
    }
    return 494;
  }

  # The /api/ body is the API's own 405 body, so a TRACE, or a method outside the set /api/
  # serves, that nginx refuses reads like a method a route does not declare.
  location @method_not_allowed {
    types { }
    default_type application/json;
    if ($uri ~ "^/api/") {
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
      return 405 '{"error":{"code":"method_not_allowed","message":"Method Not Allowed"}}';
    }
    if ($method_not_allowed_no_store) {
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
      return 405;
    }
    return 405;
  }

  location @not_implemented {
    types { }
    default_type application/json;
    if ($uri ~ "^/api/") {
      add_header_inherit merge;
      add_header Cache-Control "no-store" always;
      return 501 '{"error":{"code":"not_implemented","message":"The request uses a transfer coding the server does not support."}}';
    }
    return 501;
  }

  # The server-level 400 handler for a request with no URI to tell /api/ by: nginx's own 400
  # page, as before. `internal` keeps a client from requesting it.
  location = /.nginx/bad-request {
    internal;
    return 400;
  }

  # Hashed Vite build output: a new deployment ships new file names, so a year is safe, and
  # `immutable` stops browsers revalidating these files even on an explicit reload.
  # add_header_inherit merge keeps the server-level security headers alongside this one.
  # Without `always` it never goes on an error answer: a missing asset is a 404, never
  # index.html and never cached for a year, so a stale chunk fails loudly.
  location /assets/ {
    try_files $uri =404;
    add_header_inherit merge;
    add_header Cache-Control "max-age=31536000, immutable";
    access_log off;
  }

  # The document itself is never stored (exactly one `Cache-Control: no-store`), so every load
  # fetches it: a new deployment's asset names are picked up at once, and the signed-in
  # document stays out of the browser's back/forward cache, so Back after sign-out loads it
  # afresh and the app's auth guard re-checks the session (web/src/main.tsx also reloads a page
  # a browser restores from that cache anyway). SPA fallbacks land here as well, so every
  # client-side route carries it. add_header_inherit merge keeps the server-level security
  # headers alongside this one.
  location = /index.html {
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
  }

  # No icon set ships yet; answer browsers' automatic icon request with an empty 204
  # instead of serving them the HTML document.
  location = /favicon.ico {
    return 204;
    access_log off;
    log_not_found off;
  }

  # Well-known files crawlers and agents request. Without these locations the SPA fallback below
  # would answer each with index.html, which no crawler can read. None declares an add_header,
  # so each keeps the server-level security headers, and each request is logged.
  # /robots.txt lets every crawler read the screens and keeps it out of /api/. A screen opened
  # without a session shows only the sign-in form: the sign-in requirement, not robots.txt, keeps
  # the data private, and disallowing `/` would only mark every screen as blocked from indexing.
  # `types { }` and default_type make the answer text/plain.
  location = /robots.txt {
    types { }
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /api/\n";
  }

  # The product publishes no llms.txt and no sitemap: a plain 404, never the SPA document.
  location = /llms.txt {
    return 404;
  }

  location = /sitemap.xml {
    return 404;
  }

  # SPA fallback: /login, /actions, /decisions, /sources, /settings and their query strings
  # are client-side routes. `$uri/` is left out so a directory never triggers a redirect.
  location / {
    try_files $uri /index.html;
  }
}
