# Ads Action Engine web server: serves the built SPA and reverse-proxies /api to the API.
#
# web/Dockerfile copies this file to /etc/nginx/conf.d/default.conf in nginx:1.30.5, replacing
# the image's default server. The image's main nginx.conf includes conf.d/*.conf inside its
# http {} block, so the directives above the server block below are http-level directives.
#
#   /api/          proxied to http://api:8000 (the Compose `api` service), URI unchanged
#   /assets/       hashed Vite build output, cached immutable for a year; a missing file 404s
#   /index.html    the SPA document, revalidated on every load
#   /favicon.ico   204: the product ships no icon set
#   everything     else falls back to /index.html (SPA routes such as /actions?run=<id>)
#
# Out of scope here, by design: TLS, HSTS, basic auth and upstream health checks. nginx listens
# on plain HTTP 8080 for the local stack (APP_BASE_URL http://localhost:8080). Any other host
# must terminate TLS in front of nginx and use an https:// APP_BASE_URL (docs/runbook.md).

# Docker's embedded DNS. The api_backend upstream below marks its server `resolve`, so nginx
# re-resolves the `api` name in the background (every 10 s) rather than once at startup: an
# `api` container that restarts with a new address is picked up, and nginx starts, and
# `nginx -t` passes, even while `api` does not resolve. The Compose network carries IPv4 only.
resolver 127.0.0.11 valid=10s ipv6=off;

# The API (the Compose `api` service), with a pool of idle connections nginx reuses instead of
# opening a new TCP connection per request. `resolve` needs the shared-memory zone, and an
# unresolved `api` leaves the group empty, so /api/ answers 502 until the name resolves.
# keepalive caps the idle connections each worker process keeps. keepalive_timeout must stay
# below uvicorn's own idle limit (--timeout-keep-alive, 5 s by default and not overridden):
# nginx then always closes an idle connection before uvicorn does, and never reuses one that
# uvicorn is closing, which would surface as a 502 for a POST, a request nginx does not retry.
upstream api_backend {
  zone api_backend 64k;
  server api:8000 resolve;
  keepalive 16;
  keepalive_timeout 4s;
}

# Host header sent to the API: the client's own Host, port included, or $host when the
# request carried none (HTTP/1.0). This departs from a bare `Host $host`, which drops the
# port: the API builds absolute URLs from Host (FastAPI's trailing-slash redirects), and
# without the port such a redirect from http://localhost:8080 would point at port 80.
map $http_host $api_host_header {
  ""      $host;
  default $http_host;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Redirects nginx issues itself (such as /api -> /api/) carry a relative Location. An
  # absolute one would name this container's own port 8080 and scheme http, which is wrong
  # once the port is published elsewhere or TLS is terminated in front of nginx.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # API request bodies are small JSON documents (login, decisions, feedback, run windows).
  client_max_body_size 1m;

  # text/html is always compressed once gzip is on; these add the other text formats the
  # SPA and the API send. Vary: Accept-Encoding keeps shared caches from mixing encodings.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Security headers, on every response (`always` covers 4xx/5xx and proxied API answers).
  # nginx drops inherited add_header directives in any location that declares its own, so
  # /api/ and /assets/ declare their Cache-Control after `add_header_inherit merge`, which
  # keeps these three as well. No other location uses add_header; caching elsewhere is set
  # with `expires`, which does not drop them.
  # The production bundle has no inline script or style: index.html loads external module
  # scripts and stylesheets only, and React applies `style` props through the CSSOM, which
  # style-src 'self' permits. Every request, /api included, is same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  location /api/ {
    # The api_backend upstream above, with no URI part: the original request URI
    # (/api/v1/...) is passed unchanged. Reusing its pooled connections needs HTTP/1.1 and
    # an empty Connection header, since nginx otherwise sends `Connection: close` upstream.
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $api_host_header;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Overwrite X-Forwarded-For; never append to it with $proxy_add_x_forwarded_for.
    # The API keys its login limit (5 attempts per minute per IP) on the address uvicorn
    # (--proxy-headers) takes from this header when nginx is a trusted peer: the leftmost
    # entry when every peer is trusted (--forwarded-allow-ips *), the rightmost untrusted
    # entry otherwise. Appending would keep a client-written value at the left, so a
    # client could claim a fresh address on every attempt and escape the limit. Set to
    # $remote_addr, the header holds exactly one entry, the peer connected to nginx, and
    # both rules pick it.
    #
    # Behind an external TLS terminator, $remote_addr is the terminator itself and every
    # client would share one key. An operator then restores the client address with the
    # realip module, trusting the terminator alone, for example:
    #   set_real_ip_from <terminator address or CIDR>;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    # after which $remote_addr is the client again and this header stays one entry.
    # (X-Forwarded-Proto then reads http; the session cookie's Secure flag follows
    # APP_BASE_URL, not this header.)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # POST /api/v1/runs computes a custom-window run synchronously (30 s target), and the
    # API cancels any request after its own 45 s deadline. 120 s keeps nginx from cutting
    # in first with a bare 504, so a slow request still ends in the API's error envelope.
    proxy_read_timeout 120s;
    proxy_buffering on;

    # API bodies are the signed-in operator's evidence, decisions and identity: no browser or
    # shared cache may keep one after sign-out (CWE-525). This ingress is authoritative, so
    # every /api/ answer, the API's own or one nginx makes itself (502 while the API is down,
    # 504, 413 over client_max_body_size), carries exactly one `Cache-Control: no-store`. The
    # API sends the same value; its copy is hidden so the answer never repeats the header.
    # add_header_inherit merge keeps the server-level Content-Security-Policy,
    # X-Content-Type-Options and Referrer-Policy, which nginx otherwise drops in a location
    # that declares its own add_header.
    proxy_hide_header Cache-Control;
    add_header_inherit merge;
    add_header Cache-Control "no-store" always;
  }

  # Hashed Vite build output: a new deployment ships new file names, so a year is safe, and
  # `immutable` stops browsers revalidating these files even on an explicit reload.
  # add_header_inherit merge keeps the server-level security headers alongside this one.
  # Without `always` it never goes on an error answer: a missing asset is a 404, never
  # index.html and never cached for a year, so a stale chunk fails loudly.
  location /assets/ {
    try_files $uri =404;
    add_header_inherit merge;
    add_header Cache-Control "max-age=31536000, immutable";
    access_log off;
  }

  # The document itself is revalidated on every load (Cache-Control: no-cache), so a new
  # deployment's asset names are picked up at once. SPA fallbacks land here as well.
  location = /index.html {
    expires -1;
  }

  # No icon set ships yet; answer browsers' automatic icon request with an empty 204
  # instead of serving them the HTML document.
  location = /favicon.ico {
    return 204;
    access_log off;
    log_not_found off;
  }

  # SPA fallback: /login, /actions, /decisions, /sources, /settings and their query strings
  # are client-side routes. `$uri/` is left out so a directory never triggers a redirect.
  location / {
    try_files $uri /index.html;
  }
}
