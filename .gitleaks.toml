# Gitleaks secret-scan configuration for the Ads Action Engine.
#
# Run only through gitleaks v8.30.1 from the pinned image zricethezav/gitleaks:v8.30.1, which
# `make secret-scan` and CI run as published, never rebuilt or patched;
# a finding fails the job. `gitleaks git` scans every commit, which is the gate. `gitleaks dir`
# on a working tree also reads the gitignored `.env` that `make init` writes, and reports its
# SESSION_SECRET and APP_ADMIN_PASSWORD_HASH by design: that file must never be committed.
#
# The built-in ruleset and its global allowlist are inherited unchanged. The rules below add the
# product's own credentials, which the built-in rules cannot recognise by shape:
#   n8n webhook secret, session secret, LinkedIn OAuth credentials, HubSpot token, argon2 hash.
#
# Assignment rules share one shape, so their behaviour is uniform:
# - the name, bare or quoted, followed by `=`, `:=`, `?=`, `+=` or `:`. Bare keys are env files,
#   shell, YAML, Makefile and keyword arguments (`NAME=value`, `NAME: value`); quoted keys are
#   JSON, Python dicts, TOML, header dicts and subscripts (`"NAME": "value"`, `'NAME': 'value'`,
#   `"NAME" = "value"`, `environ["NAME"] = "value"`). Only an optional closing quote and an
#   optional `]` may stand between the name and the separator, so a longer name such as
#   N8N_WEBHOOK_SECRET_HEADER or SESSION_SECRET_FILE never matches. Quoted keys are covered by
#   these rules, not by the built-in generic-api-key, whose 3.5 entropy floor misses
#   digits-only secrets;
# - spaces and tabs only around the separator, never a newline, so an empty `KEY=` line in
#   `.env.example` can never borrow the next line as its value;
# - a value with no whitespace, quote, backtick or template/shell metacharacter
#   ({ } $ ( ) < > [ ] | \ , ; * %), so `${VAR}`, `$(cmd)`, `{name}`, `<placeholder>`,
#   `[REDACTED]` and `****` are never read as secrets;
# - a value of 16 characters or more, quoted or bare, after any of those key forms, with the
#   name in any case;
# - a value of any length, down to one character, in four literal forms, so a short secret is
#   reported while code that merely names the setting is not:
#   - a quoted string with its closing quote, after any key form (`name="value"`);
#   - a bare run of digits ended by a non-value character or the end, after any key form: JSON,
#     YAML and Python numbers, and the live n8n secret, which is digits only;
#   - a bare value after a bare name and `=`, `:=`, `?=` or `+=`, ended by a quote, backtick,
#     `;`, whitespace or the end: env files, shell `export` (`export NAME=value;`), inline
#     `NAME=value cmd`, Makefile, Dockerfile `ENV` and Markdown code spans;
#   - a bare value after a bare name and `:`, ended by a quote or backtick, or by optional
#     spaces then `#`, a newline or the end: YAML and Compose, `curl -H` headers and HTTP
#     header lines. A `:` value with more text after it is left alone, so a Python annotation
#     (`NAME: Final = ...`) and prose (`header NAME: missing or empty`) are not secrets;
#   the bare forms take the name in exact upper case (the X-Webhook header names in any case),
#   which leaves settings annotations (`name: SecretStr | None`) alone, and the bare name and
#   the end tests leave `"NAME": variable,`, `fn(NAME=variable)`, `headers["NAME"] == variable`
#   and `{"NAME": None}` alone;
# - a short value holds at least one ASCII letter or digit, so a sed or awk pattern such as
#   `s/^NAME=/` and an elided `...` are not secrets; a lone repeated letter such as `zzz` is
#   already excused by the built-in global allowlist;
# - no entropy floor: the live n8n secret is digits only, so its entropy is at most
#   log2(10), about 3.32, below the 3.5 floor the built-in generic rule uses;
# - no secretGroup: each branch captures its value in its own group, and gitleaks 8.30.1 reports
#   the first non-empty group of a match.
# Attribute paths, UPPER_SNAKE constants and placeholder values that do match are excused by the
# code-reference allowlist below, and the short stand-in values three unit tests committed by the
# allowlist after it.
#
# Allowlists stay narrow: every one is scoped to named rules (targetRules), and those that name
# paths combine them with a value test (condition = "AND"). Nothing allowlists `.env` or
# `.env.example`; the template passes because its secrets are empty. All regexes are Go RE2.

title = "Ads Action Engine secret scan"
minVersion = "v8.30.1"

[extend]
useDefault = true

# -----------------------------------------------------------------------------------------------
# Rules
# -----------------------------------------------------------------------------------------------

[[rules]]
id = "n8n-webhook-secret"
description = "n8n Google Ads webhook shared secret assigned a literal value: N8N_WEBHOOK_SECRET, the N8N_GOOGLE_ADS_WEBHOOK_TOKEN alias, or the X-Webhook-Secret / X-Webhook-Token header."
regex = '''(?i:N8N_WEBHOOK_SECRET|N8N_GOOGLE_ADS_WEBHOOK_TOKEN|X-Webhook-(?:Secret|Token))['"]?\]?[ \t]*(?:[:?+]?=|:)[ \t]*(?:['"]?([^\s'"\x60{}$()<>\[\]|\\,;*%]{16,})|['"]([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)['"]|(\d+)(?:[\s'"\x60{}$()<>\[\]|\\,;*%]|$))|(?:N8N_WEBHOOK_SECRET|N8N_GOOGLE_ADS_WEBHOOK_TOKEN|(?i:X-Webhook-(?:Secret|Token)))[ \t]*[:?+]?=[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60;]|\s|$)|(?:N8N_WEBHOOK_SECRET|N8N_GOOGLE_ADS_WEBHOOK_TOKEN|(?i:X-Webhook-(?:Secret|Token)))[ \t]*:[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60]|[ \t\r]*(?:#|\n|$))'''
keywords = ["n8n_webhook_secret", "n8n_google_ads_webhook_token", "x-webhook-secret", "x-webhook-token"]
tags = ["ads-engine"]

[[rules]]
id = "session-secret"
description = "SESSION_SECRET (session cookie signing key) assigned a literal value; the real value is written to .env by make init."
regex = '''(?i:SESSION_SECRET)['"]?\]?[ \t]*(?:[:?+]?=|:)[ \t]*(?:['"]?([^\s'"\x60{}$()<>\[\]|\\,;*%]{16,})|['"]([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)['"]|(\d+)(?:[\s'"\x60{}$()<>\[\]|\\,;*%]|$))|(?:SESSION_SECRET)[ \t]*[:?+]?=[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60;]|\s|$)|(?:SESSION_SECRET)[ \t]*:[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60]|[ \t\r]*(?:#|\n|$))'''
keywords = ["session_secret"]
tags = ["ads-engine"]

[[rules]]
id = "linkedin-token"
description = "LinkedIn Marketing API OAuth credential (LINKEDIN_ACCESS_TOKEN, LINKEDIN_REFRESH_TOKEN or LINKEDIN_CLIENT_SECRET) assigned a literal value."
regex = '''(?i:LINKEDIN_(?:ACCESS_TOKEN|REFRESH_TOKEN|CLIENT_SECRET))['"]?\]?[ \t]*(?:[:?+]?=|:)[ \t]*(?:['"]?([^\s'"\x60{}$()<>\[\]|\\,;*%]{16,})|['"]([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)['"]|(\d+)(?:[\s'"\x60{}$()<>\[\]|\\,;*%]|$))|(?:LINKEDIN_(?:ACCESS_TOKEN|REFRESH_TOKEN|CLIENT_SECRET))[ \t]*[:?+]?=[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60;]|\s|$)|(?:LINKEDIN_(?:ACCESS_TOKEN|REFRESH_TOKEN|CLIENT_SECRET))[ \t]*:[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60]|[ \t\r]*(?:#|\n|$))'''
keywords = ["linkedin_"]
tags = ["ads-engine"]

[[rules]]
id = "hubspot-token"
description = "HubSpot Service Key or private-app token assigned a literal value: HUBSPOT_ACCESS_TOKEN or the HUBSPOT_PRIVATE_APP_TOKEN alias."
regex = '''(?i:HUBSPOT_(?:ACCESS_TOKEN|PRIVATE_APP_TOKEN))['"]?\]?[ \t]*(?:[:?+]?=|:)[ \t]*(?:['"]?([^\s'"\x60{}$()<>\[\]|\\,;*%]{16,})|['"]([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)['"]|(\d+)(?:[\s'"\x60{}$()<>\[\]|\\,;*%]|$))|(?:HUBSPOT_(?:ACCESS_TOKEN|PRIVATE_APP_TOKEN))[ \t]*[:?+]?=[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60;]|\s|$)|(?:HUBSPOT_(?:ACCESS_TOKEN|PRIVATE_APP_TOKEN))[ \t]*:[ \t]*([^\s'"\x60{}$()<>\[\]|\\,;*%]*[0-9A-Za-z][^\s'"\x60{}$()<>\[\]|\\,;*%]*)(?:['"\x60]|[ \t\r]*(?:#|\n|$))'''
keywords = ["hubspot_access_token", "hubspot_private_app_token"]
tags = ["ads-engine"]

# The built-in hubspot-api-key rule knows only the retired UUID API key, so the private-app
# token shape (pat-{region}{n}-{uuid}) is matched wherever it appears, whatever it is named.
[[rules]]
id = "hubspot-private-app-token"
description = "HubSpot private-app access token (pat-<region><n>-<uuid>) anywhere in a file."
regex = '''\bpat-[a-z]{2}\d-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
keywords = ["pat-"]
tags = ["ads-engine"]

# A committed admin hash is a credential leak: it permits offline guessing of the admin
# password. The real hash lives only in .env (APP_ADMIN_PASSWORD_HASH). `$$` is accepted
# because Compose and make escape `$` that way.
[[rules]]
id = "argon2-hash"
description = "Argon2 password hash in PHC format, such as the APP_ADMIN_PASSWORD_HASH value."
regex = '''\$\$?argon2(?:id|i|d)\$\$?v=\d+\$\$?m=\d+,t=\d+,p=\d+\$\$?[A-Za-z0-9+/]{11,}\$\$?[A-Za-z0-9+/]{16,}'''
keywords = ["argon2"]
tags = ["ads-engine"]

# -----------------------------------------------------------------------------------------------
# Allowlists
# -----------------------------------------------------------------------------------------------
#
# Every allowlist names its rules. A global allowlist (no targetRules) that lists paths makes
# gitleaks 8.30.1 `dir` skip each matching file outright, ignoring condition = "AND"
# (sources/common.go shouldSkipPath), so a path-plus-value allowlist would silently become a
# whole-directory pass. Targeted allowlists are evaluated per finding with AND honoured in both
# `git` and `dir` scans. They name only the key-based heuristics: the built-in generic-api-key
# and the four assignment rules above. A provider-shaped token (the custom HubSpot pat- rule
# hubspot-private-app-token plus the built-in shape rules such as AWS, GitHub and JWT) or an
# argon2 hash is reported wherever it appears, even beside a redaction marker.

# Code references and obvious placeholders, for the four assignment rules only. A value that is
# an attribute path (`settings.linkedin_access_token`), an UPPER_SNAKE constant
# (`LINKEDIN_ACCESS_TOKEN`), a placeholder-prefixed value (`your-token-here`, `test-...`,
# `ci-...`), the exact value `simulated` or a mask (`xxxxxxxx`) is not a credential. `simulated`
# is excused only as the exact stand-in header value the simulator's webhook requests carry, so
# a value that merely starts with it is still reported. Generated secrets never take these
# forms: hex and base64 values carry digits or mixed case, and the live n8n secret is digits only.
[[allowlists]]
description = "Code references and placeholder values in the ads-engine assignment rules."
targetRules = ["n8n-webhook-secret", "session-secret", "linkedin-token", "hubspot-token"]
regexes = [
  '''^[a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)+$''',
  '''^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$''',
  '''(?i)^(?:change[-_.]?me|ci[-_.]|dummy|e2e[-_.]|example|fake|not[-_.]?a[-_.]?secret|placeholder|redacted|sample|test|your[-_.])''',
  '''^simulated$''',
  '''(?i)x{8,}''',
]

# Short stand-in credentials three unit tests committed. Two redaction tests assign short secrets
# to setting names to prove that a short secret is redacted too: test_cli.py (its short-secret
# redaction policy, whose URL-redaction test also configures `sec/ret=1`, a secret holding the
# URL delimiters `/` and `=`) and test_connector_errors_types.py (the error-message sanitizer).
# test_connector_http.py gives the X-Webhook-Secret request header the non-ASCII value
# `caf\u00e9`, written as a Python escape, so that building the request raises
# UnicodeEncodeError; gitleaks decodes the escape and reports `café`. They are in committed
# history, which cannot be rewritten. Scoped to the four assignment rules, to those three files
# and to these exact values, so any other value in those files, and these values anywhere else,
# still report. New tests use `test-`-prefixed values or values assembled at run time, as the
# test conventions already require.
[[allowlists]]
description = "Short stand-in credentials three unit tests committed: two redaction tests' short secrets and the HTTP client test's non-ASCII header value."
targetRules = ["n8n-webhook-secret", "session-secret", "linkedin-token", "hubspot-token"]
condition = "AND"
paths = [
  '''(?:^|/)backend/tests/unit/test_(?:cli|connector_errors_types|connector_http)\.py$''',
]
regexes = [
  '''^(?:4242|ABC|abc|a/b\+c|café|red|sec/ret=1|short|short7x|xyz)$''',
]

# Redacted live captures and simulator fixtures. `ads-engine capture-fixtures` redacts emails,
# names and tokens before writing backend/tests/contracts/*/captured/, and the simulator only
# emits addresses on the reserved sim.invalid domain. The markers are those of
# backend/src/ads_engine/logging.py (`[REDACTED]`, `[REDACTED_EMAIL]`, also used by cli.py),
# plus `<redacted>` and `****`; keep this list in sync with backend/src/ads_engine/cli.py.
# The test is on the matched text, not the whole line: a capture written as one-line JSON is a
# single line, so a line test would let one marker excuse every other value in the file.
[[allowlists]]
description = "Redacted live captures and simulator fixtures: the matched text carries a redaction marker or a sim.invalid address."
targetRules = ["generic-api-key", "n8n-webhook-secret", "session-secret", "linkedin-token", "hubspot-token"]
condition = "AND"
paths = [
  '''(?:^|/)backend/tests/contracts/.+\.json$''',
  '''(?:^|/)backend/tests/fixtures/.+''',
]
regexTarget = "match"
regexes = [
  '''(?i)<redacted>|\bREDACTED(?:_[A-Z0-9]+)*\b|\*{4}''',
  '''(?i)@sim\.invalid\b''',
]

# Documented sample values copied verbatim from official reference pages (LinkedIn Lead Sync,
# HubSpot associations, Google Ads) into the top-level contract files, which the parser tests
# must use unchanged. Scoped to the built-in generic-api-key and the four assignment rules, so the
# HubSpot pat- rule, the built-in shape rules and argon2-hash still report here, and to files
# directly under backend/tests/contracts/{google,linkedin,hubspot}/, so captured/ and fixtures
# are outside it. The secret, not the line, is searched unanchored and case-insensitively for
# `example`, `sample`, `placeholder`, `x{8,}` or `your[-_]?token`, so any value containing one is
# admitted whatever its length or entropy: a high-entropy value with `example` inside passes. The
# safeguard is that real captured tokens are redacted before commit and live only under captured/.
[[allowlists]]
description = "Placeholder sample values from official API reference pages in contract files."
targetRules = ["generic-api-key", "n8n-webhook-secret", "session-secret", "linkedin-token", "hubspot-token"]
condition = "AND"
paths = [
  '''(?:^|/)backend/tests/contracts/(?:google|linkedin|hubspot)/[^/]+\.json$''',
]
regexes = [
  '''(?i)example|sample|placeholder|x{8,}|your[-_]?token''',
]

# Opaque pagination cursors (LinkedIn `nextPageToken`/`pageToken`, Google `nextPageToken`,
# `page_token`). A cursor selects the next page of a request that is itself authenticated; it
# grants no access, and LinkedIn's documented samples carry high-entropy ones. Scoped to the
# built-in generic-api-key rule, so a cursor field holding a real provider key shape is still
# reported by that provider's rule.
[[allowlists]]
description = "Pagination cursors in contract and fixture payloads (generic-api-key only)."
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(?:^|/)backend/tests/contracts/.+\.json$''',
  '''(?:^|/)backend/tests/fixtures/.+''',
]
regexTarget = "match"
regexes = [
  '''(?i)^["']?(?:next[-_]?)?page[-_]?token["']?[ \t]*[:=]''',
]

# Synthetic metric keys in the web end-to-end tests (`{ key: 'e2e_unavailable_count' }`). The
# routed edge-case pages inject evidence metrics whose keys are lowercase snake-case identifiers
# carrying an `e2e` segment, such as e2e_floored_count and baseline_e2e_floored_cost; some sit just
# above the 3.5 entropy floor. A key made only of lowercase words and underscores is a field name,
# not a credential: generated secrets carry digits or mixed case, and the value test admits no
# digit outside the fixed `e2e` segment and no upper case, so hex and base64 never pass.
# Scoped to the built-in generic-api-key rule, whose `key:` heuristic is what such a line trips,
# and to web/tests/e2e/, so the same value anywhere else, and any provider key shape, is still
# reported.
[[allowlists]]
description = "Synthetic e2e metric keys in the web end-to-end tests (generic-api-key only)."
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(?:^|/)web/tests/e2e/[^/]+\.ts$''',
]
regexes = [
  '''^(?:[a-z]+_)*e2e(?:_[a-z]+)+$''',
]
