# Ads Action Engine: Alembic configuration (alembic ~=1.20.0).
#
# The schema is created by the single revision migrations/versions/0001_initial_schema.py.
#
# Where this file is read
# - Host: commands run from backend/ (`uv run alembic upgrade head`), or from any other
#   directory with `-c backend/alembic.ini`.
# - Image: the `migrate` Compose service runs `ads-engine migrate` in /app, the image WORKDIR,
#   which holds this file and migrations/. cli.py loads alembic.ini from the current working
#   directory and calls `alembic.command.upgrade(cfg, "head")`.
#
# Database URL and secrets
# - `sqlalchemy.url` is intentionally absent. migrations/env.py reads DATABASE_URL through
#   ads_engine.settings.get_settings() and passes it straight to the engine; it never calls
#   `set_main_option`, because ConfigParser `%` interpolation would corrupt URL-encoded
#   passwords. Never add a database URL or any other secret to this file.

[alembic]
# Resolved relative to this file, so it works from any working directory.
script_location = %(here)s/migrations

# Splits path lists with os.pathsep. Alembic >= 1.16 expects this key; without it Alembic
# warns and falls back to legacy splitting on spaces, commas and colons.
path_separator = os

# Revision 0001 with slug "initial_schema" gives 0001_initial_schema.py. New revisions pass
# an explicit sequential id, for example `uv run alembic revision --rev-id 0002 -m "add
# keyword labels"`, which writes 0002_add_keyword_labels.py.
file_template = %%(rev)s_%%(slug)s

# Maximum length of the slug part of a generated file name.
truncate_slug_length = 40

# Time zone of the "Create Date" rendered into new revision files.
timezone = UTC

# prepend_sys_path is deliberately not set: `uv sync` installs ads_engine into the virtual
# environment (editable on the host, as a wheel in the image), so env.py imports it without
# any sys.path change.
#
# No [post_write_hooks] section: revision files are formatted and linted by the project's
# own `uv run ruff format` and `uv run ruff check` runs.

# ---------------------------------------------------------------------------------------------
# Logging, for the standalone `alembic` CLI only.
#
# `ads-engine migrate` and tests/conftest.py set cfg.attributes["configure_logger"] = False,
# so env.py skips logging.config.fileConfig and the structlog JSON logging configured by
# ads_engine.logging stays in charge. sqlalchemy.engine stays at WARNING so SQL statements and
# their bound parameters never reach the logs.
# ---------------------------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
